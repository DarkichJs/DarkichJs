name: Update animated README

# Refreshes the contribution heatmap, ASCII portrait and stats daily from real
# data — plus on every push that touches the generator, plus on demand.

on:
  schedule:
    - cron: '17 3 * * *' # daily, ~03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'readme.config.json', 'avatar.png', 'package*.json', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read output format
        id: cfg
        run: echo "format=$(jq -r '.format // "svg"' readme.config.json)" >> "$GITHUB_OUTPUT"

      # Raster formats render through Remotion (Chrome); SVG needs neither step.
      - name: Install Chrome for Testing
        if: steps.cfg.outputs.format != 'svg'
        run: npx remotion browser ensure --chrome-mode=chrome-for-testing

      - name: Install img2webp
        if: steps.cfg.outputs.format == 'webp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Fetch data, render animations, write README
        env:
          # Add a GH_PAT secret (read:user) to include private contributions;
          # without any token the public calendar page is scraped instead.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data README.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: refresh profile animations [skip ci]'
            git push
          fi
